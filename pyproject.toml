[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-si-on"
version = "0.1.0"
description = "vi.si.on — Ambient Desktop AI Overlay with Spatial Clutter Minimization and Dynamic Typometry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mitro54" }
]
dependencies = [
    "PyQt6>=6.6.0",
    "mss>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "ollama>=0.4.0",
    "pynput>=1.7.6",
    "litellm>=1.40.0",
    "httpx>=0.25.0",
    "chromadb>=0.4.0",
    "mcp[cli]>=1.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
"vi.si.on" = "desktop_ambient_ai.main:main"
vision = "desktop_ambient_ai.main:main"
ambient-ai = "desktop_ambient_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

